server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA — tanpa try_files, halaman yang di-refresh jadi 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Aset ber-hash: nama berubah tiap build, aman di-cache selamanya.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Ini TIDAK boleh di-cache, kalau tidak versi baru tidak pernah sampai ke teknisi.
    location = /index.html { add_header Cache-Control "no-cache" always; }
    location = /sw.js      { add_header Cache-Control "no-cache" always; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache" always; }
}
