    <title>Dash5</title>
    <!-- Theme init: apply before React renders to prevent flash -->
    <script>
      (function() {
        var t = localStorage.getItem('dash-theme') || 'dark';
        document.documentElement.classList.add(t + '-theme');
        var color = t === 'light' ? '#FFFFFF' : '#1C1917';
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', color);
      })();
    </script>
