<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#E87100" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dash⁵" />

    <!-- SEO / Social -->
    <meta name="description" content="Dash⁵ — AI Diagnostic Assistant" />

    <!-- Fonts: preconnect first, then non-blocking load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=DM+Serif+Display:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <title>Dash⁵</title>
    <!-- Theme init: apply before React renders to prevent flash -->
    <script>
      (function() {
        var t = localStorage.getItem('dash-theme') || 'dark';
        document.documentElement.classList.add(t + '-theme');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
